services:
  frontend:
    build:
      context: frontend
    environment:
      VITE_API_ORIGIN: /api
    volumes:
      - frontend:/app/frontend/dist
    logging:
      options: {max-size: 10m, max-file: '3'}
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - db:/data/db
    networks: [internal]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options: {max-size: 10m, max-file: '3'}
  backend:
    build:
      context: backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      DB_ADDRESS: mongodb://root:${MONGO_PASSWORD:-example}@mongo:27017/weblarek?authSource=admin
      ORIGIN_ALLOW: http://localhost:5173,http://localhost
      TRUST_PROXY: '1'
      COOKIE_SECURE: 'false'
      SEED_PATH: /app/.dump
    volumes:
      - public:/app/src/public
      - ./.dump:/app/.dump:ro
    networks: [internal]
    depends_on:
      mongo: {condition: service_healthy}
    logging:
      options: {max-size: 10m, max-file: '3'}
  server:
    build:
      context: nginx
    ports: [127.0.0.1:80:80]
    volumes:
      - frontend:/var/app:ro
    depends_on:
      frontend: {condition: service_completed_successfully}
      backend: {condition: service_started}
    networks: [internal]
    logging:
      options: {max-size: 10m, max-file: '3'}
volumes:
  frontend:
  public:
  db:
networks:
  internal:
