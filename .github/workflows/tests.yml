name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
    tags:
      - '**'
env:
  DIR_TESTS: /tmp/tests-bad-server
  REP_TESTS: https://github.com/Yandex-Practicum/tests-bad-server.git
  REPO: ${{ github.event.repository.name }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Set up GitHub Actions
      uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Get testing lib
      run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
    - name: Start project
      run: bash $DIR_TESTS/bin/start_project.sh
    - name: Generate missing upload fixtures
      run: |
        docker compose exec -T backend node -e "require('sharp')({create:{width:400,height:400,channels:3,background:'#ff5533'}}).png({compressionLevel:0}).toBuffer().then(buffer=>process.stdout.write(buffer))" > "$DIR_TESTS/data/mimage.png"
        docker compose exec -T backend node -e "require('sharp')({create:{width:2000,height:2000,channels:3,background:'#ff5533'}}).png({compressionLevel:0}).toBuffer().then(buffer=>process.stdout.write(buffer))" > "$DIR_TESTS/data/bimage.png"
    - name: Run tests
      run: bash $DIR_TESTS/bin/run.sh
